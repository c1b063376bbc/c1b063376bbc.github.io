# ──────────────────────────────────────────────
# Ed's Personal Site
# ──────────────────────────────────────────────

title: "Ed's Personal Site"
author: "Ed"
email: ed@cybe.red
description: >-
  Kişisel düşünceler, teknik yazılar, politik notlar ve dijital özgürlük üzerine.
baseurl: ""
url: "https://ed.cybe.red"
lang: tr

# Sosyal medya
github_username: dkey5

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

# Tema yok — kendi layoutlarımızı kullanıyoruz
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Koleksiyonlar
collections:
  notes:
    output: true
    permalink: /notlar/:title/
  articles:
    output: true
    permalink: /yazilar/:title/

# Varsayılan front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "notes"
    values:
      layout: "note"
  - scope:
      path: ""
      type: "articles"
    values:
      layout: "article"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Exclude
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
