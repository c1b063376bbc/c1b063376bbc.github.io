backend:
  name: git-gateway
  branch: main

# Yayınlanmamış yazılar için editorial workflow (isteğe bağlı)
# publish_mode: editorial_workflow

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

locale: "tr"

slug:
  encoding: "ascii"
  clean_accents: true

collections:
  # ── Blog Yazıları (posts) ──────────────────
  - name: "posts"
    label: "Blog Yazıları"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Başlık", name: "title", widget: "string" }
      - { label: "Tarih", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Açıklama", name: "description", widget: "string", required: false }
      - { label: "İçerik", name: "body", widget: "markdown" }

  # ── Yazılar (articles) ─────────────────────
  - name: "articles"
    label: "Yazılar"
    folder: "_articles"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Başlık", name: "title", widget: "string" }
      - { label: "Tarih", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Açıklama", name: "description", widget: "string", required: false }
      - { label: "İçerik", name: "body", widget: "markdown" }

  # ── Notlar (notes) ─────────────────────────
  - name: "notes"
    label: "Notlar"
    folder: "_notes"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Başlık", name: "title", widget: "string" }
      - { label: "Tarih", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Açıklama", name: "description", widget: "string", required: false }
      - { label: "İçerik", name: "body", widget: "markdown" }

  # ── Sayfalar ────────────────────────────────
  - name: "pages"
    label: "Sayfalar"
    files:
      - label: "Ana Sayfa"
        name: "index"
        file: "index.markdown"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "home" }
          - { label: "Başlık", name: "title", widget: "string" }
          - { label: "İçerik", name: "body", widget: "markdown" }
      - label: "Hakkımda"
        name: "about"
        file: "about.markdown"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Başlık", name: "title", widget: "string" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/hakkimda/" }
          - { label: "İçerik", name: "body", widget: "markdown" }
      - label: "GPG Anahtarı"
        name: "gpg"
        file: "gpg.markdown"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Başlık", name: "title", widget: "string" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/gpg/" }
          - { label: "İçerik", name: "body", widget: "markdown" }
      - label: "Bağlantılar"
        name: "baglantilar"
        file: "baglantilar.markdown"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Başlık", name: "title", widget: "string" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/baglantilar/" }
          - { label: "İçerik", name: "body", widget: "markdown" }
