<!DOCTYPE html>
<html lang="{{ site.lang | default: 'tr' }}">
<head>
  {% include head.html %}
</head>
<body>
  {% include header.html %}

  <main class="site-main">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>&copy; {{ site.time | date: "%Y" }} {{ site.title }}</span>
    </div>
  </footer>

  <script src="{{ '/assets/js/app.js' | relative_url }}" defer></script>
</body>
</html>
